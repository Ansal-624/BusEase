{% extends 'base.html' %}
{% block title %}Register New Bus{% endblock %}

{% block content %}
<h2 class="mb-4 d-flex justify-content-between align-items-center">
    Register a New Bus
    <!-- 🔙 Back Button -->
    <a href="javascript:history.back()" class="btn btn-secondary btn-sm">
        ← Back
    </a>
</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
        <label for="bus_name">Bus Name</label>
        <input type="text" name="bus_name" id="bus_name" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="bus_number">Bus Number</label>
        <input type="text" name="bus_number" id="bus_number" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="total_seats">Total Seats</label>
        <input type="number" name="total_seats" id="total_seats" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="owner_contact_number">Owner Contact Number</label>
        <input type="text" name="owner_contact_number" id="owner_contact_number" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="driver_name">Driver’s Name</label>
        <input type="text" name="driver_name" id="driver_name" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="driver_contact_number">Driver’s Contact Number</label>
        <input type="text" name="driver_contact_number" id="driver_contact_number" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="driver_license">Driver’s License</label>
        <input type="file" name="driver_license" id="driver_license" class="form-control">
    </div>

    <div class="mb-3">
        <label for="registration_document">Vehicle Registration Document</label>
        <input type="file" name="registration_document" id="registration_document" class="form-control">
    </div>

    <div class="mb-3">
        <label for="pollution_test_certificate">Pollution Test Certificate</label>
        <input type="file" name="pollution_test_certificate" id="pollution_test_certificate" class="form-control">
    </div>

    <div class="mb-3">
        <label for="insurance_document">Insurance Document</label>
        <input type="file" name="insurance_document" id="insurance_document" class="form-control">
    </div>

    <!-- 📸 Multiple Photos Upload -->
    <div class="mb-3">
        <label for="bus_photos">Upload Bus Photos (You can select multiple)</label>
        <input type="file" name="bus_photos" id="bus_photos" class="form-control" accept="image/*" multiple>
        <small class="text-muted">Supported formats: JPG, PNG</small>
    </div>

    <button type="submit" class="btn btn-primary">Submit for Approval</button>
</form>
{% endblock %}
