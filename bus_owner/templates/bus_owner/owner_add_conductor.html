{% extends 'base.html' %}
{% block title %}Add Conductor - Government Transport Portal{% endblock %}

{% block content %}
<style>
  /* Teal & Orange Government Theme */
  :root {
    --gov-primary: #00695c;
    --gov-secondary: #ff8f00;
    --gov-accent: #004d40;
    --gov-light: #e0f2f1;
    --gov-gradient: linear-gradient(135deg, #00695c 0%, #004d40 100%);
    --gov-success: #28a745;
    --gov-warning: #ffc107;
    --gov-danger: #dc3545;
    --gov-info: #17a2b8;
  }

  .gov-form-container {
    max-width: 800px;
    margin: 40px auto;
  }
  
  .gov-form-card {
    background: white;
    border-radius: 6px;
    padding: 30px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    border: 1px solid #e0e0e0;
    position: relative;
  }
  
  .gov-form-title {
    color: var(--gov-primary);
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .gov-form-title i {
    color: var(--gov-secondary);
  }
  
  .gov-form-group {
    margin-bottom: 20px;
  }
  
  .gov-form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  
  @media (max-width: 768px) {
    .gov-form-row {
      grid-template-columns: 1fr;
    }
  }
  
  .gov-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    color: var(--gov-primary);
    margin-bottom: 6px;
    font-size: 0.85rem;
  }
  
  .gov-label i {
    color: var(--gov-secondary);
  }
  
  .gov-required {
    color: var(--gov-danger);
    margin-left: 3px;
  }
  
  .gov-input, .gov-textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 0.9rem;
    transition: all 0.2s ease;
    background: white;
  }
  
  .gov-input:focus, .gov-textarea:focus {
    border-color: var(--gov-primary);
    box-shadow: 0 0 0 2px rgba(0,105,92,0.1);
    outline: none;
  }
  
  .gov-textarea {
    resize: vertical;
    min-height: 80px;
  }
  
  .gov-file-upload {
    border: 1px dashed var(--gov-primary);
    border-radius: 4px;
    padding: 20px;
    text-align: center;
    background: #f8f9fa;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }
  
  .gov-file-upload:hover {
    background: var(--gov-light);
    border-color: var(--gov-secondary);
  }
  
  .gov-file-upload i {
    font-size: 1.5rem;
    color: var(--gov-secondary);
    margin-bottom: 8px;
  }
  
  .gov-file-upload p {
    color: var(--gov-primary);
    font-weight: 500;
    margin: 0;
    font-size: 0.85rem;
  }
  
  .gov-file-upload small {
    font-size: 0.7rem;
    color: #888;
  }
  
  .gov-file-input {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }
  
  .gov-file-preview {
    margin-top: 10px;
    padding: 6px 10px;
    background: var(--gov-light);
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--gov-primary);
  }
  
  .gov-action-buttons {
    display: flex;
    gap: 15px;
    margin-top: 30px;
  }
  
  @media (max-width: 768px) {
    .gov-action-buttons {
      flex-direction: column;
    }
  }
  
  .gov-btn-submit {
    flex: 1;
    background: var(--gov-primary);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.2s ease;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  
  .gov-btn-submit:hover {
    background: var(--gov-accent);
    transform: translateY(-2px);
  }
  
  .gov-btn-cancel {
    flex: 1;
    background: white;
    color: #666;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    text-align: center;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  
  .gov-btn-cancel:hover {
    background: #f5f5f5;
  }
</style>

<div class="gov-form-container">
  <div class="gov-form-card">
    <h2 class="gov-form-title">
      <i class="bi bi-person-plus-fill"></i>
      Add New Conductor
    </h2>
    
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      
      <div class="gov-form-row">
        <div class="gov-form-group">
          <label class="gov-label">
            <i class="bi bi-person"></i>
            First Name <span class="gov-required">*</span>
          </label>
          <input type="text" name="first_name" class="gov-input" required>
        </div>
        
        <div class="gov-form-group">
          <label class="gov-label">
            <i class="bi bi-person"></i>
            Last Name <span class="gov-required">*</span>
          </label>
          <input type="text" name="last_name" class="gov-input" required>
        </div>
      </div>
      
      <div class="gov-form-group">
        <label class="gov-label">
          <i class="bi bi-envelope"></i>
          Email Address <span class="gov-required">*</span>
        </label>
        <input type="email" name="email" class="gov-input" required>
      </div>
      
      <div class="gov-form-row">
        <div class="gov-form-group">
          <label class="gov-label">
            <i class="bi bi-person-badge"></i>
            Username <span class="gov-required">*</span>
          </label>
          <input type="text" name="username" class="gov-input" required>
        </div>
        
        <div class="gov-form-group">
          <label class="gov-label">
            <i class="bi bi-telephone"></i>
            Phone Number <span class="gov-required">*</span>
          </label>
          <input type="tel" name="phone" class="gov-input" required>
        </div>
      </div>
      
      <div class="gov-form-row">
        <div class="gov-form-group">
          <label class="gov-label">
            <i class="bi bi-lock"></i>
            Password <span class="gov-required">*</span>
          </label>
          <input type="password" name="password" class="gov-input" required>
        </div>
        
        <div class="gov-form-group">
          <label class="gov-label">
            <i class="bi bi-lock-fill"></i>
            Confirm Password <span class="gov-required">*</span>
          </label>
          <input type="password" name="confirm_password" class="gov-input" required>
        </div>
      </div>
      
      <div class="gov-form-group">
        <label class="gov-label">
          <i class="bi bi-geo-alt"></i>
          Address
        </label>
        <textarea name="address" class="gov-textarea" placeholder="Enter complete address"></textarea>
      </div>
      
      <div class="gov-form-group">
        <label class="gov-label">
          <i class="bi bi-camera"></i>
          Profile Photo
        </label>
        <div class="gov-file-upload" id="fileUploadArea">
          <i class="bi bi-cloud-upload"></i>
          <p>Click to upload photo</p>
          <small>Supported: JPG, PNG (Max 5MB)</small>
          <input type="file" name="profile_photo" id="profilePhoto" class="gov-file-input" accept="image/*">
        </div>
        <div id="filePreview" class="gov-file-preview" style="display: none;">
          <i class="bi bi-image"></i>
          <span id="fileName"></span>
        </div>
      </div>
      
      <div class="gov-action-buttons">
        <button type="submit" class="gov-btn-submit">
          <i class="bi bi-check-circle"></i> Create Conductor
        </button>
        <a href="{% url 'owner_conductors_list' %}" class="gov-btn-cancel">
          <i class="bi bi-x-circle"></i> Cancel
        </a>
      </div>
    </form>
  </div>
</div>

<script>
  const fileInput = document.getElementById('profilePhoto');
  const filePreview = document.getElementById('filePreview');
  const fileName = document.getElementById('fileName');
  
  fileInput.addEventListener('change', function() {
    if (this.files.length > 0) {
      fileName.textContent = this.files[0].name;
      filePreview.style.display = 'flex';
    } else {
      filePreview.style.display = 'none';
    }
  });
</script>
{% endblock %}
