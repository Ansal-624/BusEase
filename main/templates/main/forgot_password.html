{% extends "base.html" %}
{% load static %}
{% block title %}Forgot Password - BusEase{% endblock %}

{% block content %}

<style>
  /* Teal & Orange Government Theme */
  :root {
    --gov-primary: #00695c;
    --gov-secondary: #ff8f00;
    --gov-accent: #004d40;
    --gov-light: #e0f2f1;
    --gov-gradient: linear-gradient(135deg, #00695c 0%, #004d40 100%);
    --gov-success: #28a745;
    --gov-warning: #ffc107;
    --gov-danger: #dc3545;
    --gov-info: #17a2b8;
  }

  .login-wrapper {
    min-height: calc(100vh - 200px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: #f5f5f5;
  }

  .login-container {
    max-width: 480px;
    width: 100%;
  }

  .login-card {
    background: white;
    border-radius: 6px;
    padding: 40px 35px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    position: relative;
    overflow: hidden;
    border: 1px solid #e0e0e0;
    animation: slideUp 0.6s ease-out;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--gov-gradient);
  }

  .login-header {
    text-align: center;
    margin-bottom: 30px;
  }

  .login-icon {
    width: 70px;
    height: 70px;
    background: var(--gov-gradient);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 4px 12px rgba(0, 105, 92, 0.3);
  }

  .login-icon i {
    font-size: 2rem;
    color: white;
  }

  .login-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--gov-primary);
    margin-bottom: 8px;
  }

  .login-subtitle {
    color: #666;
    font-size: 0.9rem;
  }

  .form-label {
    font-weight: 500;
    color: var(--gov-primary);
    margin-bottom: 8px;
    font-size: 0.85rem;
    display: block;
  }

  .form-label i {
    margin-right: 5px;
  }

  .form-control {
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 0.95rem;
    transition: all 0.2s ease;
  }

  .form-control:focus {
    border-color: var(--gov-primary);
    box-shadow: 0 0 0 2px rgba(0, 105, 92, 0.1);
    outline: none;
  }

  .input-group {
    position: relative;
  }

  .input-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #999;
    font-size: 1rem;
    z-index: 10;
  }

  .form-control.with-icon {
    padding-left: 38px;
  }

  .btn-login {
    background: var(--gov-primary);
    border: none;
    border-radius: 4px;
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: 500;
    color: white;
    width: 100%;
    margin-top: 10px;
    transition: all 0.2s ease;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-login:hover {
    background: var(--gov-accent);
    transform: translateY(-2px);
  }

  .back-link {
    text-align: center;
    margin-top: 25px;
  }

  .back-link a {
    color: var(--gov-primary);
    font-weight: 500;
    text-decoration: none;
    font-size: 0.9rem;
  }

  .back-link a:hover {
    color: var(--gov-secondary);
    text-decoration: underline;
  }

  /* Alert styling */
  .gov-alert {
    padding: 10px 15px;
    border-radius: 4px;
    margin-bottom: 20px;
    border-left: 3px solid;
    font-size: 0.9rem;
  }

  .gov-alert-success {
    background: #d4edda;
    color: #155724;
    border-left-color: var(--gov-success);
  }

  .gov-alert-error, .gov-alert-danger {
    background: #f8d7da;
    color: #721c24;
    border-left-color: var(--gov-danger);
  }

  .gov-alert-info {
    background: #d1ecf1;
    color: #0c5460;
    border-left-color: var(--gov-info);
  }

  i.bi {
    font-size: 0.95rem;
  }
</style>

<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card">

      <!-- Header -->
      <div class="login-header">
        <div class="login-icon">
          <i class="bi bi-key"></i>
        </div>
        <h2 class="login-title">Forgot Password</h2>
        <p class="login-subtitle">
          Enter your registered email to receive a 4-digit OTP
        </p>
      </div>

      <!-- Messages -->
      {% for message in messages %}
        <div class="gov-alert gov-alert-{{ message.tags }}">
          <i class="bi bi-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}exclamation-circle{% else %}info-circle{% endif %}"></i>
          {{ message }}
        </div>
      {% endfor %}

      <!-- Form -->
      <form method="POST">
        {% csrf_token %}

        <div class="mb-4">
          <label class="form-label">
            <i class="bi bi-envelope"></i> Email Address
          </label>
          <div class="input-group">
            <i class="bi bi-envelope-fill input-icon"></i>
            <input
              type="email"
              name="email"
              class="form-control with-icon"
              placeholder="Enter your registered email"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn-login">
          <i class="bi bi-send"></i> Send OTP
        </button>
      </form>

      <!-- Back -->
      <div class="back-link">
        <a href="{% url 'login' %}">
          <i class="bi bi-arrow-left"></i> Back to Login
        </a>
      </div>

    </div>
  </div>
</div>

{% endblock %}
