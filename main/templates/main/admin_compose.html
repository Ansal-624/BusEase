{% extends "base.html" %}
{% load static %}
{% block title %}Compose Message{% endblock %}

{% block content %}
<style>
  /* Teal & Orange Government Theme */
  :root {
    --gov-primary: #00695c;
    --gov-secondary: #ff8f00;
    --gov-accent: #004d40;
    --gov-light: #e0f2f1;
    --gov-gradient: linear-gradient(135deg, #00695c 0%, #004d40 100%);
    --gov-success: #28a745;
    --gov-warning: #ffc107;
    --gov-danger: #dc3545;
    --gov-info: #17a2b8;
  }

  .gov-main-card {
    background: white;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
    overflow: hidden;
    margin-bottom: 25px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .gov-card-header {
    background: #fafafa;
    padding: 15px 20px;
    border-bottom: 2px solid var(--gov-primary);
  }

  .gov-card-header h3 {
    color: var(--gov-primary);
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .gov-card-header h3 i {
    color: var(--gov-secondary);
  }

  .gov-content-padding {
    padding: 20px;
  }

  .gov-form-group {
    margin-bottom: 20px;
  }

  .gov-form-label {
    font-weight: 500;
    color: var(--gov-primary);
    margin-bottom: 8px;
    font-size: 0.85rem;
    display: block;
  }

  .gov-form-control {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 0.95rem;
    transition: all 0.2s ease;
  }

  .gov-form-control:focus {
    outline: none;
    border-color: var(--gov-primary);
    box-shadow: 0 0 0 2px rgba(0, 105, 92, 0.1);
  }

  textarea.gov-form-control {
    resize: vertical;
    min-height: 120px;
  }

  .gov-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--gov-primary);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 8px 24px;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s ease;
    cursor: pointer;
    font-size: 0.95rem;
  }

  .gov-btn:hover {
    background: var(--gov-accent);
    transform: translateY(-2px);
    color: white;
  }

  .gov-btn-secondary {
    background: #6c757d;
  }

  .gov-btn-secondary:hover {
    background: #5a6268;
  }

  .gov-alert {
    padding: 12px 16px;
    border-radius: 4px;
    margin-bottom: 20px;
    border-left: 4px solid;
  }

  .gov-alert-danger {
    background: #f8d7da;
    color: #721c24;
    border-left-color: var(--gov-danger);
  }

  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .text-muted {
    color: #888 !important;
  }

  i {
    font-size: 1rem;
  }
</style>

<div class="container mt-4">
  <div class="gov-main-card">
    <div class="gov-card-header">
      <h3>
        <i class="bi bi-envelope-paper"></i> 
        Admin Compose
      </h3>
    </div>
    <div class="gov-content-padding">
      {% if error %}
        <div class="gov-alert gov-alert-danger">
          <i class="bi bi-exclamation-triangle"></i> {{ error }}
        </div>
      {% endif %}
      
      <form method="post">
        {% csrf_token %}
        
        <div class="gov-form-group">
          <label class="gov-form-label">
            <i class="bi bi-person"></i> Recipient Username
          </label>
          <input type="text" class="gov-form-control" name="to_username" placeholder="Enter recipient username" required>
        </div>
        
        <div class="gov-form-group">
          <label class="gov-form-label">
            <i class="bi bi-tag"></i> Subject
          </label>
          <input type="text" class="gov-form-control" name="subject" placeholder="Enter message subject" required>
        </div>
        
        <div class="gov-form-group">
          <label class="gov-form-label">
            <i class="bi bi-chat-text"></i> Message
          </label>
          <textarea class="gov-form-control" name="body" rows="6" placeholder="Type your message here..." required></textarea>
        </div>
        
        <div class="btn-group">
          <button type="submit" class="gov-btn">
            <i class="bi bi-send"></i> Send Message
          </button>
          <a href="{% url 'admin_dashboard' %}" class="gov-btn gov-btn-secondary">
            <i class="bi bi-arrow-left"></i> Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
